<style>
/* =====================================================
   ARKIVERAD TEKNIK — scroll-driven clapperboard-intro
   Bruten ur STEP1FILM (index.html / style.css / main.js), juli 2026.
   Fristående: den här filen + bg-stage.jpg är allt som behövs.
   ===================================================== */

/* DSEG7 Classic — 7-segment LCD display font */
@font-face {
  font-family: 'DSEG7Classic';
  src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'DSEG7Classic';
  src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

/* ---- Tokens ---- */
:root {
  --bg:        #0c0c0c;
  --surface:   #141414;
  --surface-2: #101010;
  --line:      rgba(255,255,255,0.08);
  --line-s:    rgba(255,255,255,0.18);
  --text:      #e2e2e2;
  --text-dim:  #888;
  --white:     #f2f2f2;

  /* Accent — overridable via the Tweaks panel. Defaults to filmic red. */
  --red:       #e01c1c;
  --accent:    var(--red);
  --accent-soft: color-mix(in oklab, var(--accent) 65%, transparent);

  --ff-display: 'Bebas Neue', Impact, sans-serif;
  --ff-body:    'Inter', system-ui, sans-serif;

  --nav-h: 58px;
  --ease:  cubic-bezier(0.16, 1, 0.3, 1);

  --grain-op: 0.038;

/* =====================================================
   STAGE BACKGROUND — fixed, sits behind the clapper.
   Darkened with a layered overlay so the clapper reads cleanly.
   ===================================================== */
#stage-bg {
  position: fixed; inset: 0;
  z-index: 7999;
  background:
    linear-gradient(180deg, rgba(8,8,10,.97), rgba(8,8,10,.97)),
    url('bg-stage.jpg') center / cover no-repeat;
}

/* Hide hero while clapper is active so it can never bleed through */
body.clapper-visible #hero { visibility: hidden; }

/* =====================================================
   NOTEBOOK ZONES — scattered across stage-bg backdrop
   ===================================================== */
#nb-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.nb-zone {
  position: absolute;
  max-width: min(34ch, 26vw);
  pointer-events: none;
  opacity: 1;
  }

.nb-zone-inner {
  font-family: var(--ff-body);
  font-size: clamp(0.60rem, 1.0vw, 0.78rem);
  line-height: 2;
  color: rgba(230, 225, 210, 0.72);
  text-shadow: 0 1px 14px rgba(0,0,0,0.95), 0 0 2px rgba(0,0,0,0.8);
}
.nb-zone-inner p { margin: 0; }

.nb-h {
  font-family: var(--ff-display);
  font-size: clamp(0.50rem, 0.88vw, 0.65rem);
  letter-spacing: 0.38em;
  color: rgba(230, 225, 210, 0.44);
  line-height: 2.5;
}
.nb-b { line-height: 2; }
.nb-syr {
  direction: rtl;
  font-family: 'Estrangelo Edessa', 'Serto Jerusalem', 'Noto Sans Syriac', serif;
  font-size: clamp(0.70rem, 1.15vw, 0.88rem);
  letter-spacing: 0.02em;
  line-height: 2.2;
}
.nb-rtl {
  direction: rtl;
  font-family: 'Segoe UI', 'Noto Naskh Arabic', Arial, sans-serif;
  font-size: clamp(0.70rem, 1.2vw, 0.88rem);
  letter-spacing: 0;
  line-height: 2.2;
}

.nb-h.nb-typing::after,
.nb-b.nb-typing::after {
  content: '';
  display: inline-block;
  width: 1.5px;
  height: 0.82em;
  background: rgba(230, 225, 210, 0.75);
  vertical-align: text-bottom;
  margin-left: 2px;
  animation: nb-blink 0.88s step-end infinite;
}
@keyframes nb-blink { 0%,100%{opacity:1} 50%{opacity:0} }

@media (max-width: 900px) {
  .nb-zone { max-width: min(28ch, 80vw); }
  .nb-zone-inner { font-size: clamp(0.58rem, 2vw, 0.72rem); }
}

/* =====================================================
   CLAPPERBOARD
   ===================================================== */
#clapper {
  position: fixed; inset: 0;
  z-index: 8000;
  background: transparent;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  perspective: 1400px;
  perspective-origin: 50% 40%;
}

.cl-scene {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  /* No constant floating — the clapper stays still and dominant. */
}

.cl-lights { display: none; }
.cl-spot { position: absolute; top: 0; width: 7%; height: 90%; transform-origin: 50% 0%; }
.cl-floor-glow { display: none; }
.cl-haze { display: none; }

/* ---- Clapperboard prop ----
   First-version look (cream board + colorful arm). The BOARD is locked
   to 16:9; arm sits on top, prop has natural total height. */
.cl-prop {
  --arm-h: clamp(50px, 8vw, 150px);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -48%) scale(0.42) rotateY(-15deg) rotateX(7deg);
  width: clamp(360px, 82vw, 1500px);
  z-index: 5;
  filter: none;
  transform-style: preserve-3d;
  opacity: 0;
  transition: opacity 0.8s ease;
}

#clapper.is-active .cl-prop {
  opacity: 1;
}

.cl-arm {
  transition: transform 0.08s linear;
}

/* Hide the SCROLL TO BEGIN hint once the user has started closing the arm */
.cl-prop.is-closing .cl-hint,
.cl-prop.is-closed .cl-hint {
  opacity: 0;
  transition: opacity 0.35s ease;
}

.cl-arm {
  position: relative;
  height: var(--arm-h);
  width: 100%;
  background: #111;
  transform-origin: 0% 100%;
  transform: rotate(-16deg);
  will-change: transform;
  z-index: 2;
  overflow: hidden;
  border-radius: 3px 3px 0 0;
}

.cl-arm-stripes {
  position: absolute;
  top: 12%; left: 3%; right: 3%; bottom: 12%;
  display: flex;
  overflow: hidden;
  gap: 3px;
  border: 1px solid rgba(255,255,255,0.06);
}

.cl-arm-stripes::before {
  content: '';
  position: absolute;
  inset: -30% -10%;
  background: linear-gradient(
    -65deg,
    #111111  0%,      #111111  14.28%,
    #888888  14.28%,  #888888  28.57%,
    #111111  28.57%,  #111111  42.85%,
    #888888  42.85%,  #888888  57.14%,
    #111111  57.14%,  #111111  71.42%,
    #888888  71.42%,  #888888  85.71%,
    #111111  85.71%,  #111111  100%
  );
}

.cl-arm-info {
  display: none;
}

.cl-hinge {
  position: relative;
  width: 100%;
  height: 7px;
  background: linear-gradient(180deg, #666 0%, #2a2a2a 50%, #555 100%);
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px;
}
.cl-hinge-dot { display: none; }

/* ---- Board body (DARK variant) — 16:9 aspect ---- */
.cl-board {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  padding: clamp(0.7rem, 1.8vh, 1.5rem) clamp(0.8rem, 2.2vw, 1.8rem) clamp(1rem, 2.5vh, 2rem);
  display: flex;
  flex-direction: column;
  gap: clamp(0.6rem, 1.5vh, 1.2rem);
  background: linear-gradient(158deg, #1f1f1f 0%, #161616 55%, #0e0e0e 100%);
  border: 1px solid #2a2a2a;
  border-top: none;
  overflow: hidden;
}

.cl-board::before {
  content: '';
  position: absolute;
  top: 0; left: -1px; right: -1px;
  height: 11px;
  background: linear-gradient(180deg, #4a4a4a 0%, #1a1a1a 100%);
  z-index: 1;
}

.cl-board::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(148deg, rgba(255,255,255,0.06) 0%, transparent 45%);
  pointer-events: none;
}

.cl-brand {
  font-family: var(--ff-display);
  font-size: clamp(2rem, 4.5vw, 4.2rem);
  letter-spacing: 0.08em;
  color: var(--white);
  border-bottom: 1px solid #3a3a3a;
  padding-bottom: clamp(0.3rem, 0.8vh, 0.6rem);
  padding-top: 0.55rem;
}
.cl-brand em { color: var(--accent); font-style: normal; }

.cl-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 1fr;
  flex: 1;
  gap: 1px;
  background: #2a2a2a;
  border: 1px solid #2a2a2a;
  min-height: 0;
}
.cl-cell {
  background: linear-gradient(158deg, #1c1c1c, #141414);
  padding: clamp(0.35rem, 1vh, 0.75rem) clamp(0.4rem, 1vw, 0.9rem);
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; text-align: center;
  min-height: 0;
}
.cl-cell.wide { grid-column: span 2; }
.cl-cell--full { grid-column: span 4; }

.cl-key {
  font-size: clamp(0.62rem, 1.1vw, 0.82rem);
  letter-spacing: 0.22em;
  color: #6e6e6e;
  text-transform: uppercase;
  font-family: var(--ff-body);
}
.cl-val {
  font-family: var(--ff-display);
  font-size: clamp(1.2rem, 2.8vw, 2.2rem);
  letter-spacing: 0.05em;
  color: var(--white);
  line-height: 1;
}

/* Timecode display — 7-segment LCD style */
.cl-timecode {
  font-family: 'DSEG7Classic', monospace;
  font-size: clamp(1.4rem, 3vw, 2.6rem);
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent);
  line-height: 1;
  text-shadow: 0 0 14px rgba(224,28,28,0.65), 0 0 3px rgba(224,28,28,0.95);
  background: #0a0a0a;
  border: 1.5px solid rgba(224,28,28,0.45);
  border-radius: 4px;
  padding: 0.3em 0.6em;
  box-shadow: 0 0 10px rgba(224,28,28,0.15), inset 0 0 8px rgba(0,0,0,0.8);
}

.cl-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.2rem;
  font-size: 0.52rem;
  letter-spacing: 0.38em;
  color: #888;
  text-transform: uppercase;
  animation: clHint 2s ease-in-out infinite;
}
.cl-hint svg { width: 18px; height: 18px; opacity: 0.85; color: var(--red); }
@keyframes clHint { 0%,100%{opacity:0.5;transform:translateY(0)} 50%{opacity:1;transform:translateY(4px)} }



/* ---- Minimal grund som annars kom från sajtens style.css ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ff-body);
  font-weight: 300;
  line-height: 1.65;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Scrollzonen som driver hela sekvensen (100vh) + en yta att landa på */
#clapper-zone { height: 100vh; visibility: hidden; pointer-events: none; }
#after {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: grid; place-items: center;
  text-align: center;
  background: var(--bg);
}
#after h1 {
  font-family: var(--ff-display);
  font-size: clamp(2rem, 8vw, 6rem);
  letter-spacing: 0.12em;
}
#after p { color: var(--text-dim); letter-spacing: 0.24em; font-size: 0.72rem; text-transform: uppercase; }
#after em { color: var(--accent); font-style: normal; }

/* Klipparen syns direkt här — på sajten tändes den av intro-loadern */
#clapper { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  #clapper, #stage-bg, #clapper-zone { display: none !important; }
}
</style>

<script>
(function () {
  'use strict';

  const prefersReducedMotion =
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isWideScreen = () =>
    window.matchMedia && window.matchMedia('(min-width: 901px)').matches;

  function playClap() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      const sr = ctx.sampleRate;
      // Medium body — not too snappy, not too thuddy
      const len = (sr * 0.22) | 0;
      const buf = ctx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const t = i / sr;
        data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 65) * 1.1;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      // Lowpass at 2 kHz — keeps mids/highs that read as "clap", but kills hiss
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2000; lp.Q.value = 0.5;
      // Peak in the mid-low — softens it into a wooden 'tok' rather than a slap
      const peak = ctx.createBiquadFilter();
      peak.type = 'peaking'; peak.frequency.value = 480; peak.Q.value = 1.0; peak.gain.value = 6;
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(1.1, ctx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      noise.connect(lp); lp.connect(peak); peak.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start(ctx.currentTime);
      // Mid-low body — between snap and thump
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + 0.07);
      const oscGain = ctx.createGain();
      oscGain.gain.setValueAtTime(0.85, ctx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11);
      osc.connect(oscGain); oscGain.connect(ctx.destination);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.13);
    } catch (e) { /* audio blocked — silent */ }
  }


  function initClapperLive() {
    // ROLL — visit count, persisted in localStorage
    try {
      const rollEl = document.querySelector('[data-roll]');
      if (rollEl) {
        const visits = (parseInt(localStorage.getItem('s1f.visits') || '0', 10) || 0) + 1;
        localStorage.setItem('s1f.visits', String(visits));
        rollEl.textContent = String(Math.min(visits, 999)).padStart(3, '0');
      }
    } catch (e) { /* localStorage blocked */ }

    // DATE — current year
    const dateEl = document.querySelector('[data-date]');
    if (dateEl) dateEl.textContent = new Date().getFullYear();

    // SCENE — day of month (1–31), padded to 2 digits
    const sceneEl = document.querySelector('[data-scene]');
    if (sceneEl) {
      sceneEl.textContent = String(new Date().getDate()).padStart(2, '0');
    }

    // TAKE — month number (01–12), padded to 2 digits
    const takeEl = document.querySelector('[data-take]');
    if (takeEl) {
      takeEl.textContent = String(new Date().getMonth() + 1).padStart(2, '0');
    }

    // DAY / NIGHT — based on visitor's local hour
    const dnEl = document.querySelector('[data-day-night]');
    if (dnEl) {
      const h = new Date().getHours();
      dnEl.textContent = (h >= 6 && h < 18) ? 'DAY' : 'NIGHT';
    }

    // TIMECODE — live hh:mm:ss:ff at 25fps
    const tcEl = document.getElementById('clTimecode');
    if (tcEl) {
      const FPS = 25;
      function tickTimecode() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const ff = String(Math.floor(now.getMilliseconds() / (1000 / FPS))).padStart(2, '0');
        tcEl.textContent = hh + ':' + mm + ':' + ss + ':' + ff;
      }
      tickTimecode();
      setInterval(tickTimecode, 1000 / FPS);
    }
  }


  function initNotebookText() {
    if (prefersReducedMotion) return;

    const canvas = document.getElementById('nb-canvas');
    if (!canvas) return;

    const GLITCH = {
      'a':'s','s':'a','d':'f','f':'d','g':'h','h':'g','j':'k','k':'j','l':'k',
      'e':'r','r':'e','t':'y','y':'t','u':'i','i':'u','o':'p','n':'m','m':'n',
      'b':'v','v':'b','w':'e','A':'S','S':'A','E':'R','R':'E','T':'Y','Y':'T',
      'ä':'å','å':'ä','ö':'ä'
    };

    const BLOCKS = [
      // ── FILMSCEN 1 — svenska (kök, natt) ────────────────
      {
        dir: 'ltr',
        lines: [
          { cls: 'nb-h', text: 'SCEN 7 — INT. KÖK — NATT',          pauseAfter: 900  },
          { cls: 'nb-b', text: '',                                    pauseAfter: 80   },
          { cls: 'nb-b', text: 'Ingen pratar vid middagsbordet.',     pauseAfter: 1600 },
          { cls: 'nb-b', text: 'Bara bestick mot porslin.',           pauseAfter: 2200 },
          { cls: 'nb-b', text: '',                                    pauseAfter: 80   },
          { cls: 'nb-b', text: 'Barnet tittar på föräldrarna.',      pauseAfter: 1400 },
          { cls: 'nb-b', text: 'Föräldrarna tittar inte tillbaka.',  glitch: true, pauseAfter: 5000 }
        ]
      },
      // ── FILMSCEN 2 — svenska ──────────────────────────────
      {
        dir: 'ltr',
        lines: [
          { cls: 'nb-h', text: 'SCEN 12 — EXT. FÄLT — GRYNING', pauseAfter: 900  },
          { cls: 'nb-b', text: '',                                pauseAfter: 80   },
          { cls: 'nb-b', text: 'Mannen går mot horisonten.',      pauseAfter: 450  },
          { cls: 'nb-b', text: 'Kameran följer inte.',            pauseAfter: 2400 },
          { cls: 'nb-b', text: '',                                pauseAfter: 80   },
          { cls: 'nb-b', text: 'Han försvinner.',                 pauseAfter: 1100 },

    // Zone definitions — each has its own tilt and width for a notebook-scrap feel.

      { pos: { top:'11%', left:'78%' }, mobilePos: null,                       delay: 10100, rotate:  5, maxWidth: '22ch' },
      { pos: { top:'35%', left:'14%'  }, mobilePos: { top:'28%', left:'26%' }, delay: 20600,  rotate: -6, maxWidth: '32ch' },
      { pos: { top:'41%', left:'82%' }, mobilePos: null,                       delay: 35500, rotate:  3, maxWidth: '24ch' },
      { pos: { top:'63%', left:'20%'  }, mobilePos: { top:'69%', left:'5%'  }, delay: 45400,  rotate:  0, maxWidth: '26ch' },
      { pos: { top:'67%', left:'73%' }, mobilePos: null,                       delay: 57900, rotate: -7, maxWidth: '30ch' }
    ];

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function typeInto(el, text, glitch, rtl) {
      el.classList.add('nb-typing');
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (glitch && !rtl && GLITCH[ch] && Math.random() < 0.07) {
          el.textContent += GLITCH[ch];
          await sleep(130 + Math.random() * 90);
          el.textContent = el.textContent.slice(0, -1);
          await sleep(70);
        }
        if (!rtl && Math.random() < 0.038) await sleep(180 + Math.random() * 260);
        el.textContent += ch;
        const delay = ch === ' '            ? 38 + Math.random() * 42
                    : '.,?!:—'.includes(ch) ? 88 + Math.random() * 62
                    : rtl                   ? 62 + Math.random() * 52
                    :                         50 + Math.random() * 82;
        await sleep(delay);
      }
      el.classList.remove('nb-typing');
    }

    async function runBlock(innerEl, block) {
      innerEl.textContent = '';
      innerEl.dir = block.dir;
      for (const line of block.lines) {
        const p = document.createElement('p');
        p.className = line.cls;
        innerEl.appendChild(p);
        if (line.text.length > 0) {
          const rtl = line.cls.includes('nb-rtl') || line.cls.includes('nb-syr');
          await typeInto(p, line.text, line.glitch || false, rtl);
        }
        await sleep(line.pauseAfter || 120);
      }
    }

    // Shared across all zones — tracks which block indices are currently displayed
    const inUse = new Set();

    async function runZone(config, basePos) {
      const zoneEl = document.createElement('div');
      zoneEl.className = 'nb-zone';

      // Position with small random jitter so no two sessions look identical
      Object.entries(basePos).forEach(([prop, val]) => {
        const base = parseFloat(val);
        const jitter = (Math.random() - 0.5) * 4; // ±2 percentage points
        zoneEl.style[prop] = (base + jitter) + '%';
      });

      // Each zone keeps its tilt and width — its "notebook scrap" personality
      zoneEl.style.transform = `rotate(${config.rotate}deg)`;
      zoneEl.style.maxWidth = config.maxWidth;

      const innerEl = document.createElement('div');
      innerEl.className = 'nb-zone-inner';
      zoneEl.appendChild(innerEl);
      canvas.appendChild(zoneEl);

      await sleep(config.delay);

      let lastIdx = -1;
      while (true) {
        // Pick a block not currently shown in any other zone
        let idx;
        let tries = 0;
        do {
          idx = Math.floor(Math.random() * BLOCKS.length);
          tries++;
        } while ((inUse.has(idx) || idx === lastIdx) && tries < BLOCKS.length * 3);

        inUse.add(idx);
        lastIdx = idx;

        zoneEl.style.transition = '';
        zoneEl.style.opacity = '1';
        await runBlock(innerEl, BLOCKS[idx]);
        await sleep(1200 + Math.random() * 800);

        // Release before fading so other zones can reuse this block sooner
        inUse.delete(idx);

        zoneEl.style.transition = 'opacity 1.6s ease';
        zoneEl.style.opacity = '0';
        await sleep(1700);
        zoneEl.style.transition = '';
        await sleep(600 + Math.random() * 1400);
      }
    }

    const mobile = !isWideScreen();
    ZONE_CONFIGS.forEach(config => {
      const pos = mobile ? config.mobilePos : config.pos;
      if (!pos) return;
      runZone(config, pos);
    });

  /* --------------------------------------------------
     SCROLLDRIVAREN — hela koreografin i två faser,
     mappad mot scrollY 0 → 100vh:
       0    → 0.92  CLOSE  (armen fälls ned, tavlan roterar rakt fram, skalas upp)
       0.92 → 1.0   EXIT   (klapp-ljudet, hela scenen glider uppåt)
     På sajten fanns samma logik i två varianter (desktop/mobil);
     de var identiska för klipparens del, så här finns bara en.
  -------------------------------------------------- */
  function initClapperScroll() {
    const clapper = document.getElementById('clapper');
    const arm = document.getElementById('clapperArm');
    if (!clapper || !arm) return;

    const CLOSE_END = 0.92;
    const startScale = 0.42, endScale = 1.05;
    const startTiltY = -15, startTiltX = 7;
    let clapFired = false;

    function onScroll() {
      const vh = window.innerHeight;
      const clapP = window.scrollY / vh;
      const propEl = clapper.querySelector('.cl-prop');
      const stageEl = document.getElementById('stage-bg');

      if (clapP < 1) {
        clapper.style.display = '';
        if (stageEl) { stageEl.style.opacity = '1'; stageEl.style.display = ''; }

        if (clapP < CLOSE_END) {
          const p = clapP / CLOSE_END;
          const propEase = 1 - Math.pow(1 - p, 3);   // easeOutCubic
          arm.style.transform = `rotate(${-16 * (1 - p)}deg)`;
          const scale = startScale + (endScale - startScale) * propEase;
          if (propEl) {
            propEl.style.transform =
              `translate(-50%, -48%) scale(${scale}) rotateY(${startTiltY * (1 - propEase)}deg) rotateX(${startTiltX * (1 - propEase)}deg)`;
            propEl.classList.toggle('is-closing', clapP > 0.05);
            propEl.classList.remove('is-closed');
          }
          clapper.style.transform = '';
          clapper.style.opacity = '1';
          if (stageEl) { stageEl.style.transform = ''; stageEl.style.opacity = '1'; }
          clapFired = false;
        } else {
          arm.style.transform = 'rotate(0deg)';
          if (propEl) {
            propEl.style.transform = `translate(-50%, -48%) scale(${endScale}) rotateY(0deg) rotateX(0deg)`;
            propEl.classList.remove('is-closing');
            propEl.classList.add('is-closed');
          }
          if (!clapFired) {
            clapFired = true;
            if (!prefersReducedMotion) playClap();
          }
          const exitP = (clapP - CLOSE_END) / (1 - CLOSE_END);
          const easedExit = 1 - Math.pow(1 - exitP, 3);
          const slideY = `translateY(${-easedExit * 100}vh)`;
          clapper.style.opacity = '1';
          clapper.style.transform = slideY;
          if (stageEl) { stageEl.style.opacity = '1'; stageEl.style.transform = slideY; }
        }
      } else {
        clapper.style.display = 'none';
        clapper.style.transform = '';
        if (stageEl) { stageEl.style.display = 'none'; stageEl.style.transform = ''; }
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    onScroll();
  }

  function boot() {
    initClapperLive();
    initNotebookText();
    const clapper = document.getElementById('clapper');
    if (clapper) clapper.classList.add('is-active');
    initClapperScroll();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
