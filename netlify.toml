# =====================================================
# STEP1FILM Store — Netlify-konfiguration
# =====================================================
# Netlify publicerar denna repo som statisk sida (din nuvarande
# GitHub Pages-sida) OCH kör mappen functions/ som serverless-
# endpoints, så din Printful-nyckel aldrig hamnar i webbläsaren.
#
# Efter driftsättning nås funktionerna på:
#   https://DIN-SAJT/.netlify/functions/printful-products
#   https://DIN-SAJT/.netlify/functions/printful-order
#
# Sätt då CONFIG.printful.apiBase = '/.netlify/functions' i shop.js.
# =====================================================

[build]
  # Sidan är redan statisk HTML i repo-roten — ingen byggprocess behövs.
  publish = "."
  functions = "functions"

# _archive/ är sparad kod, inte sidor — servera den aldrig.
# (GitHub Pages hoppar redan över mappar som börjar med _.)
[[redirects]]
  from = "/_archive/*"
  to = "/index.html"
  status = 404

# =====================================================
# BUTIKEN LIGGER PÅ /store
# =====================================================
# Filen heter store.html. Netlify serverar den på /store av sig själv,
# men regeln nedan står kvar som garanti om den inställningen ändras.
# Den kan inte loopa: källan är /store, målet /store.html.
[[redirects]]
  from = "/store"
  to = "/store.html"
  status = 200

# Adressen ska vara ren. Träffar någon .html-varianten skickas den vidare.
[[redirects]]
  from = "/store.html"
  to = "/store"
  status = 301

# Butiken hette shop.html förut. Gamla länkar, bokmärken och sökträffar
# ska inte dö — och framför allt: Stripe skickar tillbaka kunden till
# den adress som låg i sessionen när betalningen startade. En betalning
# som påbörjades före omdöpningen pekar fortfarande på /shop.html, och
# frågetecknet med ?order=ok måste följa med. Netlify behåller
# frågesträngen genom en omdirigering.
[[redirects]]
  from = "/shop.html"
  to = "/store"
  status = 301

[[redirects]]
  from = "/shop"
  to = "/store"
  status = 301

# Snygg genväg: /api/* → funktionerna (valfritt, gör apiBase = '/api')
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# =====================================================
# SÄKERHETSHEADERS
# =====================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Hindra att sidan bäddas in i en iframe (clickjacking)
    X-Frame-Options = "DENY"
    # Hindra webbläsaren från att gissa filtyper
    X-Content-Type-Options = "nosniff"
    # Läck inte adressen till andra sajter
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Stäng av API:er sidan inte använder
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Tvinga HTTPS i två år (inkl. underdomäner)
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Innehållspolicy: bara egna resurser + betalningarnas domäner.
    #   img-src blob:      adminsidan visar en förhandsbild av filen du valt,
    #                      innan den laddats upp — den är en blob: i minnet.
    #   connect-src netlify adminsidan ligger på step1film.se men anropar
    #                      funktionerna på step1film.netlify.app.
    #   font-src 'self'    typsnitten ligger lokalt sedan de flyttades hem
    #                      från Google Fonts; ingen extern källa behövs.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://files.cdn.printful.com; connect-src 'self' https://api.stripe.com https://step1film.netlify.app; form-action 'self' https://checkout.stripe.com; frame-src https://player.vimeo.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Betalnings-endpoints ska aldrig cachas
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Content-Type-Options = "nosniff"
